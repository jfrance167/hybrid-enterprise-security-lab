# Install on LAB-APP01 as /etc/nginx/sites-available/default.
# The certificate and key are generated privately and are never committed.
server {
    listen 10.77.20.20:443 ssl;
    server_name app01.corp.example.test;

    ssl_certificate /etc/ssl/certs/northstar-app.crt;
    ssl_certificate_key /etc/ssl/private/northstar-app.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /var/www/html;
    index index.html;
}

name: Lab source security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse PowerShell and run PSScriptAnalyzer
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          $sources = @(Get-ChildItem scripts,labs -Filter '*.ps1' -Recurse)
          foreach ($source in $sources) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $source.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-Table; exit 1 }
          }
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $issues = @($sources | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error
          })
          if ($issues) { $issues | Format-Table; exit 1 }
      - name: Verify IAM observations and corrupted-evidence rejection
        shell: pwsh
        run: ./labs/iam-lifecycle/Test-EvidenceVerifier.ps1

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint firewall scripts
        run: find scripts -maxdepth 1 -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Parse example Wazuh XML
        run: python3 -c 'import pathlib, xml.etree.ElementTree as ET; [ET.parse(p) for p in pathlib.Path("configs").glob("*.xml")]'

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: detect --source . --redact --verbose --exit-code 2

  codeql-actions:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: actions
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:actions

  ci-gate:
    name: CI Gate
    if: always()
    needs: [powershell, php, secret-scan, codeql-actions]
    runs-on: ubuntu-latest
    steps:
      - name: Require every review job
        env:
          POWERSHELL_RESULT: ${{ needs.powershell.result }}
          PHP_RESULT: ${{ needs.php.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          CODEQL_RESULT: ${{ needs.codeql-actions.result }}
        run: |
          test "$POWERSHELL_RESULT" = success
          test "$PHP_RESULT" = success
          test "$SECRET_SCAN_RESULT" = success
          test "$CODEQL_RESULT" = success
